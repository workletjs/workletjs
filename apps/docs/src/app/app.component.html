<ng-doc-root [sidebar]="!isLandingPage()" [footerContent]="footerContent">
  <ng-doc-navbar>
    <div class="flex items-center justify-between gap-10 w-full" ngDocNavbarLeft>
      <a class="no-underline text-slate-800" routerLink="/">
        <h3 class="flex items-center m-0 text-2xl">
          <img class="h-9 mr-2" src="workletjs.png" alt="workletjs logo" />
          <span class="font-nunito font-extrabold">Workletjs</span>
        </h3>
      </a>
      <div class="flex items-center pr-12 hidden lg:block">
        <a class="workletjs-nav" routerLink="./guide" routerLinkActive="active">Guide</a>
        <a class="workletjs-nav" routerLink="./components" routerLinkActive="active">Components</a>
      </div>
    </div>
    <div class="flex items-center" ngDocNavbarRight @preventInitialChild>
      <ng-doc-theme-toggle class="ms-4" />
      <a
        class="ms-4"
        href="https://github.com/workletjs/workletjs"
        ng-doc-button-icon
        ngDocTooltip="Repository on GitHub"
        size="large"
        target="_blank"
      >
        <ng-doc-icon [size]="24" customIcon="github" />
      </a>
    </div>
  </ng-doc-navbar>
  <app-sidebar ngDocCustomSidebar />
  <router-outlet />
  <ng-template #footerContent>
    <div class="flex items-center justify-center p-6 text-xs text-gray-400">
      MIT © 2025 WORKLETJS Contributors
    </div>
  </ng-template>
</ng-doc-root>
