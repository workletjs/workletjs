<ng-doc-root [sidebar]="showSidebar()" [footerContent]="footerContent">
  <ng-doc-navbar>
    <div ngDocNavbarLeft>
      <a class="text-slate-800 no-underline dark:text-slate-200" routerLink="/">
        <h3 class="m-0 flex items-center text-2xl">
          <img class="mr-2 h-9" src="workletjs.png" alt="workletjs logo" />
          <span class="font-nunito font-extrabold">Workletjs</span>
        </h3>
      </a>
    </div>
    <div class="flex items-center" ngDocNavbarRight>
      <ng-doc-theme-toggle class="ms-4" />
      <a
        class="ms-4"
        href="https://github.com/workletjs/workletjs"
        ng-doc-button-icon
        ngDocTooltip="Repository on GitHub"
        size="large"
        target="_blank"
      >
        <ng-doc-icon [size]="24" customIcon="github" />
      </a>
    </div>
  </ng-doc-navbar>
  <app-sidebar ngDocCustomSidebar />
  <router-outlet />
  <ng-template #footerContent>
    <div class="flex items-center justify-center p-6 text-xs text-gray-400">
      MIT © 2025 WORKLETJS Contributors
    </div>
  </ng-template>
</ng-doc-root>
