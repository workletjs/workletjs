name: Publish Package & Release

on:
  push:
    tags:
      - 'v*' # 匹配例如 v1.0.0, v2.1.3-beta 等格式

permissions:
  contents: write # 允许创建 Release
  id-token: write # 用于 OIDC 身份验证（如果需要）

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整的 Git 历史以便生成变更日志

      - name: Install PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Pin to a specific patch to guarantee the bundled npm meets the
          # provenance requirement (npm >= 10.0.0).  Update together with the
          # npm minimum-version check below whenever upgrading Node.
          node-version: '22.22.2'
          cache: 'pnpm' # 开启 pnpm 缓存，加速构建

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check version
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          PKG_VERSION=$(node -p "require('./packages/ngx-openlayers/package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "❌ Tag version ($TAG_VERSION) does not match lib version ($PKG_VERSION)"
            exit 1
          fi

      - name: Extract release notes
        id: notes
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}

          OUTPUT=$(node scripts/extract-release-notes.mjs \
            --file CHANGELOG.md \
            --version $VERSION)

          RELEASE_DATE=$(echo "$OUTPUT" | head -n1 | cut -d' ' -f3)
          NOTES=$(echo "$OUTPUT" | tail -n +3)

          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "release_date=$RELEASE_DATE" >> $GITHUB_OUTPUT

      - name: Build library
        run: pnpm nx build ngx-openlayers

      # 🚨 发布前强校验（Fail Fast）
      - name: Pre-publish validation
        run: |
          set -e

          echo "🔍 Environment versions"
          node -v
          npm -v
          pnpm -v

          echo "🔍 Check npm minimum version (>= 10.0.0 required for --provenance)"
          NPM_VERSION=$(npm -v)
          NPM_MAJOR=$(echo "$NPM_VERSION" | cut -d. -f1)
          if [ "$NPM_MAJOR" -lt 10 ]; then
            echo "❌ npm $NPM_VERSION is below the required minimum 10.0.0"
            echo "   pnpm publish --provenance requires npm CLI >= 10.0.0"
            echo "   Fix: update node-version in release.yml to a 22.x release"
            echo "        that bundles npm 10+ (currently: 22.22.2 → npm 10.9.7)"
            exit 1
          fi
          echo "✅ npm $NPM_VERSION meets minimum requirement (>= 10.0.0)"

          echo "🔍 Check npm registry"
          REGISTRY=$(pnpm config get registry)
          echo "Registry: $REGISTRY"
          if [ "$REGISTRY" != "https://registry.npmjs.org/" ]; then
            echo "❌ Registry is not npmjs.org"
            exit 1
          fi

          echo "🔍 Check npm auth token (must be empty)"
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "❌ NODE_AUTH_TOKEN is set, Trusted Publishing will NOT work"
            exit 1
          fi

          echo "🔍 Inspect dist package.json"
          PKG_PATH="dist/packages/ngx-openlayers/package.json"
          cat $PKG_PATH

          NAME=$(node -p "require('./$PKG_PATH').name")
          PKG_VERSION=$(node -p "require('./$PKG_PATH').version")
          TAG_VERSION=${GITHUB_REF#refs/tags/v}

          if [ "$NAME" != "@workletjs/ngx-openlayers" ]; then
            echo "❌ Package name mismatch: $NAME"
            exit 1
          fi

          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ Version mismatch: $PKG_VERSION"
            exit 1
          fi

          echo "🔍 Check package exists on npm"
          pnpm view "$NAME" version > /dev/null

          echo "✅ Pre-publish validation passed"

      - name: Publish to npm
        run: |
          cd dist/packages/ngx-openlayers
          pnpm publish --no-git-checks --access public --provenance

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success() # 仅在前面的步骤成功时创建发布
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            `${{ steps.notes.outputs.release_date }}`

            ${{ steps.notes.outputs.body }}
