# Workflow for building and deploying website to GitHub Pages
name: Deploy Website

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to deploy (must already exist in repository, e.g. v1.0.0)'
        required: true
        type: string
  push:
    tags:
      - 'v*.*.*' # Trigger on version tags

permissions:
  contents: write # Allow the workflow to push to the repository

jobs:
  resolve-deploy-metadata:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.metadata.outputs.tag_name }}
      version: ${{ steps.metadata.outputs.version }}
      is_prerelease: ${{ steps.metadata.outputs.is_prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve deploy metadata
        id: metadata
        run: |
          set -e

          resolve_is_prerelease() {
            local version="$1"
            local semver_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'

            if [[ ! "$version" =~ $semver_pattern ]]; then
              echo "Cannot classify deploy version: $version" >&2
              return 1
            fi

            version="${version%%+*}"

            if [[ "$version" == *-* ]]; then
              printf 'true\n'
            else
              printf 'false\n'
            fi
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ inputs.tag }}"
            if [[ ! "$TAG_NAME" =~ ^v[0-9] ]]; then
              echo "❌ Tag name must start with 'v' followed by a digit (e.g. v1.0.0), got: $TAG_NAME"
              exit 1
            fi

            if ! git rev-parse "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
              echo "❌ Tag ${TAG_NAME} does not exist in this repository"
              exit 1
            fi

            echo "✅ Tag ${TAG_NAME} exists in repository"
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          fi

          VERSION="${TAG_NAME#v}"
          IS_PRERELEASE=$(resolve_is_prerelease "$VERSION")

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

  deploy-latest:
    needs: resolve-deploy-metadata
    if: ${{ needs.resolve-deploy-metadata.outputs.is_prerelease == 'false' }}
    runs-on: ubuntu-latest
    concurrency:
      group:
        pages-deploy-${{ github.workflow }}-${{ needs.resolve-deploy-metadata.outputs.tag_name }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.resolve-deploy-metadata.outputs.tag_name }}

      - name: Install PNPM
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22' # Specify Node.js version
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build documentation site
        run: pnpm run build:docs

      - name: Add SPA fallback # Copy index.html to 404.html for GitHub Pages SPA support
        run: cp ./dist/apps/docs/browser/index.html ./dist/apps/docs/browser/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }} # Use the default GITHUB_TOKEN
          external_repository: workletjs/workletjs.github.io
          publish_dir: ./dist/apps/docs/browser
          publish_branch: main
          commit_message: 'chore(release): Deploy latest website'

  deploy-version:
    runs-on: ubuntu-latest
    needs: resolve-deploy-metadata
    concurrency:
      group:
        pages-deploy-${{ github.workflow }}-${{ needs.resolve-deploy-metadata.outputs.tag_name }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.resolve-deploy-metadata.outputs.tag_name }}

      - name: Install PNPM
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22' # Specify Node.js version
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build documentation site
        run:
          pnpm dlx nx build docs --base-href=/${{ needs.resolve-deploy-metadata.outputs.tag_name }}/

      - name: Add SPA fallback # Copy index.html to 404.html for GitHub Pages SPA support
        run: cp ./dist/apps/docs/browser/index.html ./dist/apps/docs/browser/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        env:
          DEPLOY_TAG: ${{ needs.resolve-deploy-metadata.outputs.tag_name }}
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }} # Use the default GITHUB_TOKEN
          external_repository: workletjs/workletjs.github.io
          publish_dir: ./dist/apps/docs/browser
          publish_branch: main
          destination_dir: ${{ needs.resolve-deploy-metadata.outputs.tag_name }}
          commit_message: 'chore(release): Deploy website for version ${{ env.DEPLOY_TAG }}'
