# Workflow for building and deploying website to GitHub Pages
name: Deploy Website

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*' # Trigger on version tags

permissions:
  contents: write # Allow the workflow to push to the repository

jobs:
  deploy-latest:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install PNPM
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22' # Specify Node.js version
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build documentation site
        run: pnpm run build:docs

      - name: Add SPA fallback # Copy index.html to 404.html for GitHub Pages SPA support
        run: cp ./dist/apps/docs/browser/index.html ./dist/apps/docs/browser/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }} # Use the default GITHUB_TOKEN
          external_repository: workletjs/workletjs.github.io
          publish_dir: ./dist/apps/docs/browser
          publish_branch: main
          commit_message: "chore(release): Deploy latest website"

  deploy-version:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: deploy-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install PNPM
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22' # Specify Node.js version
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build documentation site
        run: pnpm dlx nx build docs --base-href=/${{ github.ref_name }}/

      - name: Add SPA fallback # Copy index.html to 404.html for GitHub Pages SPA support
        run: cp ./dist/apps/docs/browser/index.html ./dist/apps/docs/browser/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }} # Use the default GITHUB_TOKEN
          external_repository: workletjs/workletjs.github.io
          publish_dir: ./dist/apps/docs/browser
          publish_branch: main
          destination_dir: ${{ github.ref_name }}
          commit_message: "chore(release): Deploy website for version ${{ github.ref_name }}"
