name: Publish

on:
  push:
    tags:
      - 'v*' # Trigger on version tags, e.g. v1.0.0, v2.1.3-beta
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (must already exist in repository, e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write # Required to create GitHub Releases
  id-token: write # Required for OIDC Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    # Optional: uncomment and set an environment name to require manual approval before publishing.
    # The environment name must match what you configured as the Trusted Publisher on npmjs.com.
    # environment: npm-publish
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch full history so all tags are available

      - name: Resolve and validate tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ inputs.tag }}"
            # Validate format: must start with 'v' followed by a digit
            if [[ ! "$TAG_NAME" =~ ^v[0-9] ]]; then
              echo "❌ Tag name must start with 'v' followed by a digit (e.g. v1.0.0), got: $TAG_NAME"
              exit 1
            fi
            # Validate the tag exists in this repository
            if ! git rev-parse "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
              echo "❌ Tag ${TAG_NAME} does not exist in this repository"
              exit 1
            fi
            echo "✅ Tag ${TAG_NAME} exists in repository"
            # Checkout via full refs/tags/… path and detach HEAD to prevent
            # accidentally landing on a same-named branch.
            git checkout --detach "refs/tags/${TAG_NAME}"
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          fi
          echo "name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install PNPM
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # Minimum required: Node >= 22.14.0 (npm Trusted Publishing requirement).
          # npm >= 11.5.1 is required for OIDC Trusted Publishing; since Node 22.x
          # bundles npm 10.x, we update npm explicitly in the next step.
          node-version: '22.14.0'
          cache: 'pnpm'

      - name: Update npm to required minimum (11.5.1)
        # npm >= 11.5.1 is required by npm Trusted Publishing (OIDC).
        # We pin to a specific version (not @latest) to avoid MODULE_NOT_FOUND issues.
        run: |
          npm install -g npm@11.5.1
          echo "✅ npm updated: $(npm -v)"

      - name: Check version
        run: |
          TAG_VERSION="${{ steps.tag.outputs.version }}"
          PKG_VERSION=$(node -p "require('./packages/ngx-openlayers/package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "❌ Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "✅ Tag version matches package.json: $TAG_VERSION"

      - name: Extract release notes
        id: notes
        run: |
          VERSION="${{ steps.tag.outputs.version }}"

          OUTPUT=$(node scripts/extract-release-notes.mjs \
            --file CHANGELOG.md \
            --version "$VERSION")

          RELEASE_DATE=$(echo "$OUTPUT" | head -n1 | cut -d' ' -f3)
          NOTES=$(echo "$OUTPUT" | tail -n +3)

          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "release_date=$RELEASE_DATE" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm nx build ngx-openlayers

      # 🚨 Pre-publish validation (Fail Fast)
      - name: Pre-publish validation
        run: |
          set -e

          # Semantic version comparison: returns 0 (success) if $1 >= $2
          version_gte() {
            [ "$(printf '%s\n' "$2" "$1" | sort -V | tail -n1)" = "$1" ]
          }

          check_min_version() {
            local name="$1" actual="$2" required="$3"
            if version_gte "$actual" "$required"; then
              echo "✅ $name $actual >= $required"
            else
              echo "❌ $name $actual is below the required minimum $required"
              exit 1
            fi
          }

          resolve_npm_dist_tag() {
            local version="$1"
            local dist_tag="latest"
            local semver_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'

            if [[ ! "$version" =~ $semver_pattern ]]; then
              echo "Cannot derive a safe npm dist-tag from version: $version" >&2
              return 1
            fi

            version="${version%%+*}"
            if [[ "$version" == *-* ]]; then
              dist_tag="${version#*-}"
              dist_tag="${dist_tag%%.*}"
              if [[ ! "$dist_tag" =~ ^[A-Za-z][0-9A-Za-z-]*$ || "$dist_tag" =~ ^[vV][0-9] ]]; then
                echo "Cannot derive a safe npm dist-tag from version: $version" >&2
                return 1
              fi
            fi

            printf '%s\n' "$dist_tag"
          }

          resolve_github_prerelease() {
            local version="$1"

            resolve_npm_dist_tag "$version" >/dev/null || return 1
            version="${version%%+*}"

            if [[ "$version" == *-* ]]; then
              printf 'true\n'
            else
              printf 'false\n'
            fi
          }

          echo "🔍 Environment versions"
          node -v && npm -v && pnpm -v
          echo ""

          NODE_VERSION=$(node -v | sed 's/v//')
          NPM_VERSION=$(npm -v)
          PNPM_VERSION=$(pnpm -v)

          # npm Trusted Publishing requires Node >= 22.14.0 and npm >= 11.5.1
          check_min_version "Node" "$NODE_VERSION" "22.14.0"
          check_min_version "npm"  "$NPM_VERSION"  "11.5.1"
          check_min_version "pnpm" "$PNPM_VERSION" "10.0.0"
          echo ""

          echo "🔍 Check npm registry"
          REGISTRY=$(pnpm config get registry)
          echo "Registry: $REGISTRY"
          if [ "$REGISTRY" != "https://registry.npmjs.org/" ]; then
            echo "❌ Registry is not npmjs.org"
            exit 1
          fi
          echo "✅ Registry is npmjs.org"
          echo ""

          echo "🔍 Check NODE_AUTH_TOKEN (must be absent for OIDC Trusted Publishing)"
          # NODE_AUTH_TOKEN must NOT be set: OIDC exchanges a short-lived token
          # automatically. A static token would bypass Trusted Publishing.
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "❌ NODE_AUTH_TOKEN is set — OIDC Trusted Publishing will NOT work"
            exit 1
          fi
          echo "✅ NODE_AUTH_TOKEN is not set"
          echo ""

          echo "🔍 Inspect dist package.json"
          PKG_PATH="dist/packages/ngx-openlayers/package.json"
          cat "$PKG_PATH"
          echo ""

          NAME=$(node -p "require('./$PKG_PATH').name")
          DIST_VERSION=$(node -p "require('./$PKG_PATH').version")
          TAG_VERSION="${{ steps.tag.outputs.version }}"

          if [ "$NAME" != "@workletjs/ngx-openlayers" ]; then
            echo "❌ Package name mismatch: got $NAME, expected @workletjs/ngx-openlayers"
            exit 1
          fi
          echo "✅ Package name: $NAME"

          if [ "$DIST_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ Dist version ($DIST_VERSION) does not match tag version ($TAG_VERSION)"
            exit 1
          fi
          echo "✅ Dist version matches tag: $DIST_VERSION"
          NPM_DIST_TAG=$(resolve_npm_dist_tag "$DIST_VERSION")
          echo "NPM_DIST_TAG=$NPM_DIST_TAG" >> "$GITHUB_ENV"
          echo "✅ npm dist-tag: $NPM_DIST_TAG"
          GITHUB_PRERELEASE=$(resolve_github_prerelease "$DIST_VERSION")
          echo "GITHUB_PRERELEASE=$GITHUB_PRERELEASE" >> "$GITHUB_ENV"
          echo "✅ GitHub prerelease: $GITHUB_PRERELEASE"
          echo ""

          echo "🔍 Check package exists on npm"
          if ! pnpm view "$NAME" version > /dev/null 2>&1; then
            echo "❌ Package $NAME not found on npm"
            exit 1
          fi
          echo "✅ Package $NAME exists on npm"
          echo ""

          echo "✅ All pre-publish validations passed"

      - name: Publish to npm
        run: |
          cd dist/packages/ngx-openlayers
          pnpm publish --no-git-checks --access public --provenance --tag "$NPM_DIST_TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        if: success()
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          prerelease: ${{ env.GITHUB_PRERELEASE }}
          body: |
            `${{ steps.notes.outputs.release_date }}`

            ${{ steps.notes.outputs.body }}
